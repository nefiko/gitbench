<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitBench Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="header">
    <h1>GitBench Dashboard</h1>
</header>

<div class="container">
    <div class="card">
        <label for="projectPath">Project Path:</label>
        <input type="text" id="projectPath" placeholder="C:\path\to\your\project" style="width: 400px;">
        <button class="btn" onclick="loadProject()">Load</button>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat__value" id="totalBenchmarks">-</div>
            <div class="stat__label">Total Runs</div>
        </div>
        <div class="stat stat--success">
            <div class="stat__value" id="successCount">-</div>
            <div class="stat__label">Success</div>
        </div>
        <div class="stat stat--danger">
            <div class="stat__value" id="failedCount">-</div>
            <div class="stat__label">Failed</div>
        </div>
        <div class="stat">
            <div class="stat__value" id="lastRun">-</div>
            <div class="stat__label">Last Run</div>
        </div>
    </div>

    <div class="card">
        <h2>Benchmark Results</h2>
        <table class="table">
            <thead>
            <tr>
                <th>Method</th>
                <th>Commit</th>
                <th>Time (ms)</th>
                <th>Std Dev</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody id="resultsBody">
            <tr><td colspan="5">Enter project path and click Load</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadProject() {
        const projectPath = document.getElementById('projectPath').value;
        if (!projectPath) {
            alert('Please enter a project path');
            return;
        }

        try {
            const summaryRes = await fetch(`/api/projects/summary?projectPath=${encodeURIComponent(projectPath)}`);
            const summary = await summaryRes.json();

            document.getElementById('totalBenchmarks').textContent = summary.totalBenchmarks || 0;
            document.getElementById('successCount').textContent = summary.successfulRuns || 0;
            document.getElementById('failedCount').textContent = summary.failedRuns || 0;
            document.getElementById('lastRun').textContent = summary.lastRunTimestamp
                ? new Date(summary.lastRunTimestamp).toLocaleDateString()
                : '-';

            const historyRes = await fetch(`/api/benchmarks/history?projectPath=${encodeURIComponent(projectPath)}&limit=50`);
            const history = await historyRes.json();
            updateTable(history);
        } catch (e) {
            console.error(e);
            alert('Error loading project: ' + e.message);
        }
    }

    function updateTable(results) {
        const tbody = document.getElementById('resultsBody');
        if (!results || !results.length) {
            tbody.innerHTML = '<tr><td colspan="5">No benchmark data found</td></tr>';
            return;
        }
        tbody.innerHTML = results.map(r => `
                <tr>
                    <td>${r.className ? r.className.split('.').pop() : ''}#${r.methodName || ''}</td>
                    <td>${(r.commitHash || '').substring(0, 7)}</td>
                    <td>${r.averageTime != null ? r.averageTime.toFixed(3) : '-'}</td>
                    <td>${r.standardDeviation != null ? r.standardDeviation.toFixed(3) : '-'}</td>
                    <td><span class="badge badge--${r.successful ? 'success' : 'danger'}">${r.successful ? 'OK' : 'Fail'}</span></td>
                </tr>
            `).join('');
    }
</script>
</body>
</html>
